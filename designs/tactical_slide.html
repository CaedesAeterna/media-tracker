<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tactical Design Slide</title>
    <!-- Load Viz.js and its renderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script>
    <style>
        body { 
            background-color: #0f0f12; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }
        h1 { 
            font-size: 3rem; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            background: linear-gradient(45deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #graph {
            width: 95vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(20, 20, 30, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        svg {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <h1>Tactical Design: Technology Implementation</h1>
    <div id="graph"></div>

    <script>
        const dot = `
digraph G {
  bgcolor="transparent";
  fontname="Segoe UI";
  rankdir=TB; // Top to Bottom flow
  nodesep=0.6;
  ranksep=0.6;
  compound=true; // Allow edges between clusters

  // Default Node Styling
  node [fontname="Segoe UI", shape=box, style="filled,rounded", color=none, fontcolor=white, fontsize=14, margin=0.25, height=0.6];
  edge [color="#6b7280", penwidth=2, arrowhead=vee, arrowsize=0.8, fontname="Segoe UI", fontsize=10, fontcolor="#9ca3af"];

  // --- External Infrastructure ---
  subgraph cluster_infra {
    label = "Shared Event Bus";
    style=invis;
    Kafka [label="Apache Kafka\n(Events: 'media-updates')", shape=component, fillcolor="#ea580c", fontsize=14, width=3];
  }

  // --- Service 1: Python Stack ---
  subgraph cluster_python {
    label = "Media Service (Python)";
    style=dashed; color="#3b82f6"; fontcolor="#60a5fa"; margin=20;
    
    // UI Layer
    Jinja [label="UI: Jinja2 Templates", fillcolor="#1f2937", color="#3b82f6", penwidth=1];
    
    // API/Logic Layer
    FastAPI [label="API: FastAPI (Python)", fillcolor="#1d4ed8", fontcolor=white];
    
    // Data Layer
    Mongo [label="DB: MongoDB", shape=cylinder, fillcolor="#064e3b"];
    Redis [label="Cache: Redis", shape=cylinder, fillcolor="#991b1b"];

    // Flows
    Jinja -> FastAPI [dir=both, label="SSR"];
    FastAPI -> Mongo [label="Read/Write"];
    FastAPI -> Redis [label="Cache Media"];
    FastAPI -> Kafka [label="Produces", style=dashed, color="#f97316"];
  }

  // --- Service 2: Node.js Stack ---
  subgraph cluster_node {
    label = "User Service (Node.js)";
    style=dashed; color="#10b981"; fontcolor="#34d399"; margin=20;

    // UI Layer
    EJS [label="UI: EJS Templates", fillcolor="#1f2937", color="#10b981", penwidth=1];

    // API/Logic Layer
    Express [label="API: Express (Node.js)", fillcolor="#059669", fontcolor=white];

    // Data Layer
    Postgres [label="DB: PostgreSQL", shape=cylinder, fillcolor="#064e3b"];

    // Flows
    EJS -> Express [dir=both, label="SSR"];
    Express -> Postgres [label="User Profile & Library"];
    Kafka -> Express [label="Consumes", style=dashed, color="#f97316"];
  }

  // Align the tops of the services
  { rank=same; Jinja; EJS; }
}
`;
        var viz = new Viz();
        
        viz.renderSVGElement(dot)
            .then(function(element) {
                document.getElementById("graph").appendChild(element);
            })
            .catch(error => {
                console.error(error);
                document.getElementById("graph").innerHTML = "<p style='color:red'>Error rendering graph. Please check internet connection for CDN.</p>";
            });
    </script>
</body>
</html>
