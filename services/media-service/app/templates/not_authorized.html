<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Authorized</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            /* To allow content underneath to be visible and still center */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure it takes full viewport height for centering */
            margin: 0;
            background: transparent; /* Ensure page background isn't affecting */
        }
        .modal-content {
            background: white;
            padding: 30px; /* Increased padding */
            border-radius: 8px;
            text-align: center;
            position: relative;
            max-width: 500px; /* Max width for the popup */
            width: 90%; /* Responsive width */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Stronger shadow for visual pop */
            border: 1px solid #ddd; /* Subtle border */
        }
        .modal-title {
            color: #dc3545; /* Red color for warning */
            margin-bottom: 15px;
        }
        .btn-primary {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h5 class="modal-title" id="modalTitle">Access Denied</h5>
        <p>You are not authorized to perform this action or view this page. Please log in.</p>
        <a href="/auth/login" class="btn btn-primary">Login</a>
    </div>

    <!-- Bootstrap JS for modal functionality (optional, as we're using custom overlay) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script>
        // Optional: Could add logic here to automatically close or handle more complex popup behavior
        // For now, it's a persistent modal overlay with a login button.
    </script>
</body>
</html>
