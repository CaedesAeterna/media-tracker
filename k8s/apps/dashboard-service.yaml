apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
    spec:
      containers:
      - name: dashboard-service
        image: dashboard-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: USER_SERVICE_URL
          value: "http://user-service.app.svc.cluster.local:80"
        - name: MEDIA_SERVICE_URL
          value: "http://media-service.app.svc.cluster.local:80"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: app
spec:
  selector:
    app: dashboard-service
  ports:
  - port: 80
    targetPort: 8000
