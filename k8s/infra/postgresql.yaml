apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: database
data:
  # This runs on the Primary (0) during first initialization ONLY
  00-create-replicator.sh: |
    #!/bin/bash
    set -e
    # Create the replication user
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD 'replicator_pass';
    EOSQL
    
    # Configure Access (pg_hba.conf)
    # Allow replication connections from the pod subnet
    echo "host replication replicator 0.0.0.0/0 md5" >> "$PGDATA/pg_hba.conf"
    
    # Configure Postgres (postgresql.conf)
    # Enable replication settings
    echo "wal_level = replica" >> "$PGDATA/postgresql.conf"
    echo "max_wal_senders = 10" >> "$PGDATA/postgresql.conf"
    echo "max_replication_slots = 10" >> "$PGDATA/postgresql.conf"
    echo "hot_standby = on" >> "$PGDATA/postgresql.conf"

  # This runs in the InitContainer to decide if we need to clone data
  clone-data.sh: |
    #!/bin/bash
    set -e
    # Skip if we are Pod 0 (Master)
    if [[ $(hostname) == "postgres-0" ]]; then
      echo "I am the Primary. Skipping clone."
      exit 0
    fi

    # Check if data exists. If so, we assume it's valid (or persistent volume) and skip.
    # To force re-sync, one would delete the PVCs of the replicas.
    if [ -s "$PGDATA/PG_VERSION" ]; then
      echo "Data already exists. Skipping clone."
      exit 0
    fi

    echo "I am a Replica. Waiting for Primary..."
    until pg_isready -h postgres-0.postgres.database.svc.cluster.local -U admin; do
      echo "Waiting for Primary to be ready..."
      sleep 2
    done

    echo "Cloning data from Primary..."
    # PGPASSWORD is set in env
    pg_basebackup -h postgres-0.postgres.database.svc.cluster.local -D "$PGDATA" -U replicator -v -P --wal-method=stream

    echo "Creating standby.signal..."
    touch "$PGDATA/standby.signal"
    
    echo "Configuring connection info..."
    # In PG 12+, primary_conninfo goes in postgresql.auto.conf or postgresql.conf
    echo "primary_conninfo = 'host=postgres-0.postgres.database.svc.cluster.local port=5432 user=replicator password=replicator_pass'" >> "$PGDATA/postgresql.auto.conf"
    
    echo "Clone complete."
---
# Headless Service for Stable DNS (postgres-0.postgres.database...)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: postgres
---
# Read-Write Service (Master Only)
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: database
  labels:
    app: postgres
    role: master
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    statefulset.kubernetes.io/pod-name: postgres-0
---
# Read-Only Service (All Pods)
apiVersion: v1
kind: Service
metadata:
  name: postgres-ro
  namespace: database
  labels:
    app: postgres
    role: replica
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: database
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: "postgres"
  replicas: 3
  template:
    metadata:
      labels:
        app: postgres
    spec:
      initContainers:
      - name: init-clone
        image: postgres:15
        command: ["/bin/bash", "/scripts/clone-data.sh"]
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        - name: PGPASSWORD
          value: "replicator_pass" # Used for pg_basebackup
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /scripts
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "users_db"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        # Mount the init script to the special entrypoint folder
        # This will run automatically on Master (Pod 0) ONLY IF data dir is empty
        - name: config
          mountPath: /docker-entrypoint-initdb.d/00-create-replicator.sh
          subPath: 00-create-replicator.sh
      volumes:
      - name: config
        configMap:
          name: postgres-config
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi